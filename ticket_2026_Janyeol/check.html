<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0605" />
  <title>잔열 · Entry</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://gppwawgyoysctikujmed.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Noto+Serif+KR:wght@600;700&display=swap" />
  <link rel="stylesheet" href="styles.css?v=20260805-3" />
</head>
<body>
  <div class="sun-stage" aria-hidden="true"><div class="sun"></div></div>
  <div class="vignette" aria-hidden="true"></div>
  <svg class="svg-defs" aria-hidden="true">
    <filter id="heat" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.016" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" dur="18s" values="0.010 0.016;0.014 0.024;0.009 0.018;0.010 0.016" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <div class="wrap">
    <p class="kicker">Janyeol · Door</p>
    <h1 class="page-title">입장 확인 <span>·</span> Scan</h1>
    <p class="hint" style="margin-bottom:16px">QR을 비추면 자동으로 확인됩니다. 확인된 QR은 즉시 만료됩니다.</p>

    <div id="gate" class="card">
      <h2>Sign in · 확인자</h2>
      <label class="fld">확인자(입구) 비밀번호</label>
      <input id="pw" type="password" placeholder="비밀번호" />
      <label class="fld">확인자 이름 (선택)</label>
      <input id="who" placeholder="예: 입구1" />
      <button class="btn" id="enterBtn">시작</button>
      <div class="err" id="gateErr"></div>
    </div>

    <div id="scan" class="hidden">
      <div class="card">
        <div id="reader"></div>
        <div id="result"></div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn" id="nextBtn" style="margin:0">다음 스캔</button>
          <button class="btn ghost small" id="camBtn" style="margin:0">카메라 전환</button>
        </div>
        <details style="margin-top:14px">
          <summary class="hint">QR이 안 읽힐 때 · 코드 직접 입력</summary>
          <input id="manual" placeholder="QR 토큰(UUID) 붙여넣기" style="margin-top:8px" />
          <button class="btn ghost small" id="manualBtn" style="margin-top:8px">확인</button>
        </details>
        <button class="btn ghost small" id="logoutBtn" style="margin-top:14px">잠그기</button>
      </div>

      <div class="card">
        <h2>현매 추가 · Walk-in</h2>
        <p class="hint">현장에서 현금 결제한 관객을 <b>바로 입장 처리</b>하고 명단에 <b>현매</b>로 기록합니다.</p>
        <label class="fld">이름 *</label>
        <input id="wName" placeholder="이름" autocomplete="off" />
        <label class="fld">연락처 (선택)</label>
        <input id="wPhone" placeholder="010-0000-0000" inputmode="tel" autocomplete="off" />
        <label class="fld">인원 *</label>
        <div class="qty">
          <button type="button" id="wMinus">−</button>
          <span class="n" id="wN">1</span>
          <button type="button" id="wPlus">+</button>
          <span class="hint" id="wAmt" style="margin:0 0 0 8px"></span>
        </div>
        <button class="btn" id="wAddBtn">현매 입장 처리</button>
        <div id="wResult"></div>
        <div class="err" id="wErr"></div>
      </div>
    </div>

    <div class="footer"><a href="index.html">← 예매</a> · <a href="admin.html">관리자 →</a></div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"
    integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+"
    crossorigin="anonymous"
    onerror="var s=document.createElement('script');s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';s.integrity='sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+';s.crossOrigin='anonymous';document.head.appendChild(s);"></script>
  <script src="config.js?v=20260805-3"></script>
  <script src="check.js?v=20260805-2"></script>
</body>
</html>
