<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0605" />
  <title>잔열 · 예매자 명단</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Noto+Serif+KR:wght@600;700&family=Space+Mono:wght@400;700&display=swap" />
  <link rel="stylesheet" href="styles.css?v=20260805-4" />
</head>
<body>
  <div class="sun-stage" aria-hidden="true"><div class="sun"></div></div>
  <div class="vignette" aria-hidden="true"></div>
  <svg class="svg-defs" aria-hidden="true">
    <filter id="heat" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.016" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" dur="18s" values="0.010 0.016;0.014 0.024;0.009 0.018;0.010 0.016" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="wrap">
    <p class="kicker">Janyeol · Roster</p>
    <h1 class="page-title">예매자 <span>·</span> 명단 조회</h1>
    <p class="hint" style="margin-bottom:16px">읽기 전용입니다. 목록만 확인할 수 있고, 수정·발급 권한은 없습니다.</p>

    <div id="gate" class="card">
      <h2>명단 보기</h2>
      <label class="fld">명단 보기 비밀번호</label>
      <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" />
      <button class="btn" id="enterBtn">열기</button>
      <div class="err" id="gateErr"></div>
    </div>

    <div id="dash" class="hidden">
      <div class="stats" id="summary"></div>
      <div class="tabs" id="tabs">
        <button data-f="all" class="on">전체</button>
        <button data-f="confirmed">확정</button>
        <button data-f="pending">대기</button>
        <button data-f="performer">공연자</button>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
        <input id="search" type="search" placeholder="이름·밴드 검색" style="flex:1;min-width:150px;margin:0" />
        <button class="btn ghost small" id="refreshBtn">새로고침</button>
        <button class="btn ghost small" id="logoutBtn">잠그기</button>
      </div>
      <div id="rosterWrap"></div>
    </div>

    <div class="footer"><a href="index.html">← 예매</a> · <a href="performer.html">공연자</a></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js?v=20260805-4"></script>
  <script src="roster.js?v=20260805-1"></script>
</body>
</html>
