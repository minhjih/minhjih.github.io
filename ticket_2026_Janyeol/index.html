<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0605" />
  <title>잔열 殘熱 · LIVE</title>
  <meta name="description" content="잔열 공연 티켓 — 8.29 SAT 5:30PM · 001 라이브홀" />
  <meta property="og:title" content="잔열 殘熱 · LIVE" />
  <meta property="og:description" content="8.29 (토) 5:30PM · 001 라이브홀 · 7,000원" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://gppwawgyoysctikujmed.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="image" href="img/poster-main.webp?v=20260805-2" type="image/webp" fetchpriority="high" />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Noto+Serif+KR:wght@600;700;900&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600;1,700;1,900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" />
  <link rel="stylesheet" href="styles.css?v=20260805-4" />
</head>

<body>
  <div class="sun-stage" aria-hidden="true">
    <div class="sun"></div>
  </div>
  <div class="sun-flare" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <svg class="svg-defs" aria-hidden="true">
    <filter id="heat" x="-35%" y="-35%" width="170%" height="170%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" dur="15s"
          values="0.009 0.014;0.015 0.023;0.008 0.017;0.009 0.014" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" xChannelSelector="R" yChannelSelector="G" scale="34">
        <animate attributeName="scale" dur="9s" values="24;46;30;24" repeatCount="indefinite" />
      </feDisplacementMap>
    </filter>
  </svg>

  <div class="wrap">
    <header class="hero">
      <p class="kicker">Live Concert</p>
      <div class="poster-frame"><img id="posterMain" class="poster" alt="잔열 공연 포스터" decoding="async"
          fetchpriority="high" /></div>
      <div id="titleStack" class="brand hidden">
        <span class="mark">잔열<span class="echo e1">잔열</span><span class="echo e2">잔열</span><span
            class="echo e3">잔열</span></span>
      </div>

      <div class="meta">
        <div class="date" id="bDate">8.29 (토) 5:30PM</div>
        <div class="venue" id="bVenue">001 라이브홀</div>
        <div class="addr" id="bAddr"></div>
        <hr class="rule" />
        <div class="info"><span>Ticket <b id="bPrice">7,000원</b></span></div>
        <div class="lineup">RIZZ · 심사숙곰 · 브레멘</div>
        <div class="contact">문의 <a href="tel:010-2598-2629">010-2598-2629</a> · 최재현</div>
      </div>
    </header>

    <!-- 내 티켓 / 로그인 / 구매 -->
    <div id="ticketArea"></div>

    <!-- 오시는 길 (지도) -->
    <div class="eyebrow">Location</div>
    <div class="card">
      <h2 style="margin-bottom:12px">001 라이브홀 <span
          style="font-weight:400;font-size:12px;color:var(--muted);margin-left:auto;text-transform:none">서울 마포구 월드컵로 140
          지하1층</span></h2>
      <div style="margin-bottom:12px; display:flex; gap:8px;">
        <a href="https://naver.me/GhwytGNy" target="_blank" rel="noopener noreferrer" class="map-btn naver">
          네이버 지도로 열기
        </a>
        <a href="https://place.map.kakao.com/936488916" target="_blank" rel="noopener noreferrer" class="map-btn kakao">
          카카오맵으로 열기
        </a>
      </div>
      <div class="map-container">
        <picture>
          <source srcset="img/enter.webp?v=20260805-2" type="image/webp" />
          <img src="img/enter.jpg?v=20260805-2" alt="001 라이브홀 입구" loading="lazy" decoding="async"
            style="width:100%; height:auto; border-radius:10px; display:block; border:1px solid var(--line-2);" />
        </picture>
      </div>
      <p class="hint" style="margin-top:10px; font-size:12px; color:var(--gold);">⚠️ *001클럽(홍대)과 다른 장소입니다 (마포구 월드컵로 140
        지하1층)</p>
    </div>

    <!-- 큐시트 -->
    <div class="eyebrow">Timetable</div>
    <div class="card">
      <div class="poster-frame" style="margin-bottom:18px"><img id="posterCue" class="poster" alt="잔열 큐시트"
          loading="lazy" decoding="async" /></div>
      <div id="cueList"></div>
    </div>

    <div class="footer">
      잔열 殘熱 · 001 라이브홀 · <span id="fAddr"></span>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0"
    integrity="sha384-De+l/Df7qym5QBDVocD3+gW1S7IjR3epf+6KbRDjB3FCCzM/LqVTwqckT6FhFar8"
    crossorigin="anonymous"></script>
  <script src="config.js?v=20260805-3"></script>
  <script src="app.js?v=20260805-4"></script>
</body>

</html>
