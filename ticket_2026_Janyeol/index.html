<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0605" />
  <title>잔열 殘熱 · LIVE</title>
  <meta name="description" content="잔열 공연 티켓 — 8.29 FRI 5:30PM · 001 라이브홀" />
  <meta property="og:title" content="잔열 殘熱 · LIVE" />
  <meta property="og:description" content="8.29 (금) 5:30PM · 001 라이브홀 · 7,000원" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600;1,700;1,900&family=Noto+Serif+KR:wght@600;700;900&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sun-stage" aria-hidden="true"><div class="sun"></div></div>
  <div class="sun-flare" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <svg class="svg-defs" aria-hidden="true">
    <filter id="heat" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.016" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" dur="18s" values="0.010 0.016;0.014 0.024;0.009 0.018;0.010 0.016" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="wrap">
    <header class="hero">
      <p class="kicker">Live Concert</p>
      <div class="poster-frame"><img id="posterMain" class="poster" alt="잔열 공연 포스터" /></div>
      <div id="titleStack" class="brand hidden">
        <span class="mark">잔열<span class="echo e1">잔열</span><span class="echo e2">잔열</span><span class="echo e3">잔열</span></span>
      </div>

      <div class="meta">
        <div class="date" id="bDate">8.29 (금) 5:30PM</div>
        <div class="venue" id="bVenue">001 라이브홀</div>
        <div class="addr" id="bAddr"></div>
        <hr class="rule" />
        <div class="info"><span>Ticket <b id="bPrice">7,000원</b></span></div>
        <div class="lineup">RIZZ · 심사숙곰 · 브레멘</div>
      </div>
    </header>

    <!-- 내 티켓 / 로그인 / 구매 -->
    <div id="ticketArea"></div>

    <!-- 큐시트 -->
    <div class="eyebrow">Timetable</div>
    <div class="card">
      <div class="poster-frame" style="margin-bottom:18px"><img id="posterCue" class="poster" alt="잔열 큐시트" /></div>
      <div id="cueList"></div>
    </div>

    <div class="footer">
      잔열 殘熱 · 001 라이브홀 · <span id="fAddr"></span>
      <div class="lnkrow">
        <a href="admin.html">Admin</a>
        <a href="check.html">Entry</a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"
    onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';document.head.appendChild(s);"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
