<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0202" />
  <title>잔열 · 공연 티켓</title>
  <meta name="description" content="잔열 공연 티켓 예매 — 8.29 5:30PM · 001 라이브홀" />
  <meta property="og:title" content="잔열 · 공연 티켓" />
  <meta property="og:description" content="8.29 (금) 5:30PM · 001 라이브홀 · 7,000원" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 살아 있는 태양 배경 -->
  <div class="sun-stage" aria-hidden="true"><div class="sun"></div></div>
  <div class="sun-flare" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <svg class="svg-defs" aria-hidden="true">
    <filter id="heat" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.018" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" dur="15s" values="0.011 0.018;0.015 0.026;0.010 0.02;0.011 0.018" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="34" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="wrap">
    <!-- 히어로 -->
    <div class="hero">
      <div class="poster-frame">
        <img id="posterMain" class="poster" alt="잔열 공연 포스터" />
      </div>
      <div id="titleStack" class="title-stack hidden">
        <p class="echo g g3">잔열</p>
        <p class="echo g g2">잔열</p>
        <p class="echo g g1">잔열</p>
        <p class="echo">잔열</p>
        <div class="tagline">RIZZ · 심사숙곰 · 브레멘</div>
      </div>
    </div>

    <div class="badges">
      <span class="badge">📅 <b id="bDate">8.29 (금) 5:30PM</b></span>
      <span class="badge">📍 <b id="bVenue">001 라이브홀</b></span>
      <span class="badge">🎟 <b id="bPrice">7,000원</b></span>
    </div>
    <p class="addr" id="bAddr"></p>

    <!-- 내 티켓 / 로그인 / 구매 -->
    <div id="ticketArea"></div>

    <!-- 큐시트 -->
    <div class="section-title">TIMETABLE · 큐시트</div>
    <div class="card">
      <div class="poster-frame" style="margin-bottom:16px"><img id="posterCue" class="poster" alt="잔열 큐시트" /></div>
      <div id="cueList"></div>
    </div>

    <div class="footer">
      잔열 · 001 라이브홀 · <span id="fAddr"></span>
      <div class="lnkrow">
        <a href="admin.html">관리자</a>
        <a href="check.html">입장 확인</a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"
    onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';document.head.appendChild(s);"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
